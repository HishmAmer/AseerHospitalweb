{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | تجمع عسير الصحي</title>
    
    <!-- أيقونة المتصفح (Favicon) -->
    <link rel="icon" type="image/svg+xml" href="{% static 'images/logo.svg' %}">
    <link rel="shortcut icon" type="image/svg+xml" href="{% static 'images/logo.svg' %}">

    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Cairo Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           GLASSMORPHISM & SKY THEME
           ========================================= */
        body { 
            font-family: 'Cairo', system-ui, -apple-system, sans-serif;
            /* خلفية سماوية متدرجة */
            background: linear-gradient(135deg, #e0f2fe 0%, #7dd3fc 50%, #38bdf8 100%);
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            -webkit-font-smoothing: antialiased;
            margin: 0;
            position: relative;
            overflow: hidden; /* لمنع ظهور شريط التمرير بسبب الأشكال العائمة */
        }

        /* الأشكال الدائرية المموهة في الخلفية لإبراز تأثير الزجاج */
        .glass-orb-1, .glass-orb-2 {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            z-index: 0;
            opacity: 0.6;
        }
        .glass-orb-1 {
            width: 400px;
            height: 400px;
            background: #ffffff;
            top: -100px;
            right: -100px;
        }
        .glass-orb-2 {
            width: 350px;
            height: 350px;
            background: #0284c7;
            bottom: -50px;
            left: -100px;
        }
        
        .login-wrapper {
            width: 100%;
            max-width: 440px;
            padding: 24px;
            position: relative;
            z-index: 1; /* ليكون فوق الأشكال المموهة */
        }
        
        /* تأثير الزجاج العائم (Glassmorphism) */
        .premium-login-card { 
            background: rgba(255, 255, 255, 0.35); /* خلفية بيضاء شفافة */
            backdrop-filter: blur(16px); /* تمويه الخلفية */
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6); /* إطار زجاجي لامع */
            border-radius: 1.5rem; 
            box-shadow: 0 25px 50px -12px rgba(2, 132, 199, 0.25); /* ظل يتناسب مع السماء */
            padding: 48px 40px; 
        }
        
        /* تصميم مربع اللوجو الزجاجي */
        .hospital-logo-login {
            width: 88px;
            height: 88px;
            margin: 0 auto 24px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }
        .hospital-logo-login img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .form-label {
            font-size: 0.95rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 8px;
        }
        
        /* حقول الإدخال الزجاجية */
        .premium-input { 
            border-radius: 1rem; 
            padding: 14px 20px; 
            background: rgba(255, 255, 255, 0.4); 
            border: 1px solid rgba(255, 255, 255, 0.5); 
            font-size: 1rem;
            font-weight: 600;
            color: #0f172a;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        .premium-input::placeholder {
            color: #64748b;
        }
        .premium-input:focus { 
            background: rgba(255, 255, 255, 0.7);
            border-color: #ffffff; 
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.4); 
            outline: none;
        }
        
        /* زر تسجيل الدخول */
        .btn-premium-primary { 
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); 
            color: white; 
            border: none; 
            border-radius: 1rem; 
            padding: 14px; 
            font-weight: 800; 
            font-size: 1.05rem;
            width: 100%; 
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
            margin-top: 8px;
            cursor: pointer;
        }
        .btn-premium-primary:hover { 
            background: linear-gradient(135deg, #0369a1 0%, #075985 100%); 
            transform: translateY(-2px); 
            box-shadow: 0 8px 25px rgba(2, 132, 199, 0.4);
        }

        /* التنبيهات بخلفية شبه شفافة */
        .alert-premium {
            border-radius: 1rem; 
            border: 1px solid rgba(239, 68, 68, 0.3); 
            background: rgba(254, 242, 242, 0.7); 
            backdrop-filter: blur(5px);
            color: #b91c1c; 
            padding: 16px; 
            font-weight: 700; 
            font-size: 0.95rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        
        .footer-text {
            color: #0f172a; 
            font-size: 0.85rem; 
            font-weight: 700;
            text-shadow: 0 1px 2px rgba(255,255,255,0.5); /* لتحسين القراءة على الخلفية الفاتحة */
        }
    </style>
</head>
<body>

    <!-- الأشكال الهندسية العائمة في الخلفية -->
    <div class="glass-orb-1"></div>
    <div class="glass-orb-2"></div>

    <div class="login-wrapper">
        <div class="premium-login-card">
            <div class="text-center mb-5">
                <div class="hospital-logo-login">
                    <img src="{% static 'images/logo.svg' %}" alt="شعار تجمع عسير الصحي" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <i class="fas fa-hospital-alt" style="font-size: 2.5rem; color: #0284c7; display: none;"></i>
                </div>
                <h4 style="color: #0f172a; font-size: 1.35rem; font-weight: 900; margin-bottom: 6px;">تجمع عسير الصحي</h4>
                <p style="color: #334155; font-size: 0.95rem; font-weight: 700; margin-bottom: 0;">إدارة المستشفيات والمراكز المتخصصة</p>
            </div>

            <form method="POST" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="form-label">اسم المستخدم</label>
                    <input type="text" name="username" class="premium-input" placeholder="أدخل اسم المستخدم" required autofocus autocomplete="username">
                </div>
                <div class="mb-4">
                    <label class="form-label">كلمة المرور</label>
                    <input type="password" name="password" class="premium-input" placeholder="••••••••" required autocomplete="current-password">
                </div>
                
                {% if form.errors %}
                <div class="alert alert-premium text-center mb-4">
                    <i class="fas fa-exclamation-circle me-1"></i> بيانات الدخول غير صحيحة!
                </div>
                {% endif %}
                
                <button type="submit" class="btn-premium-primary">
                    تسجيل الدخول <i class="fas fa-arrow-left ms-2"></i>
                </button>
            </form>
        </div>
        
        <div class="text-center mt-4">
            <p class="footer-text">© 2026 تجمع عسير الصحي. جميع الحقوق محفوظة.</p>
        </div>
    </div>

</body>
</html>
