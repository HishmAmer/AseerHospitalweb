<style>
  /* ============================================================
     هوية النظام: أخضر القطاع الصحي السعودي على سطح فاتح، مع
     رمادي مائل للأخضر بدل الرمادي المحايد. مطابقة لنظام Django
     حتى لا يشعر المستخدم أنه انتقل إلى نظام آخر.
     ============================================================ */
  :root {
    --brand:        #16624F;
    --brand-deep:   #0E4638;
    --brand-soft:   #DCEAE4;
    --ink:          #12211C;
    --ink-2:        #3A4B44;
    --muted:        #64736C;
    --line:         #DDE3DF;
    --line-soft:    #EDF0EE;
    --surface:      #FFFFFF;
    --sunken:       #F4F6F4;
    --ground:       #F7F9F7;
    --ok:           #1B7A4B;
    --ok-soft:      #DEF0E6;
    --warn:         #8A6414;
    --warn-soft:    #FBF0D8;
    --danger:       #9E3B2E;
    --danger-soft:  #F9E5E1;
    --info:         #1C5E86;
    --info-soft:    #DEEDF7;
    --r-sm: 6px;
    --r-md: 10px;
    --r-lg: 14px;
    --r-pill: 999px;
    --shadow: 0 1px 2px rgba(18,33,28,.06), 0 4px 14px rgba(18,33,28,.05);
    --shadow-lg: 0 8px 30px rgba(18,33,28,.12);
    --sidebar: 268px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: 'Segoe UI', Tahoma, system-ui, -apple-system, sans-serif;
    font-size: 15px; line-height: 1.65;
    direction: rtl;
  }
  html { overflow-x: hidden; }

  /* ───────────── الهيكل ───────────── */
  .app { display: flex; min-height: 100vh; }

  .sidebar {
    width: var(--sidebar); flex: 0 0 var(--sidebar);
    background: #0C1A16; color: #D6E2DC;
    display: flex; flex-direction: column;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .brand {
    padding: 18px 20px; border-bottom: 1px solid rgba(255,255,255,.08);
    display: flex; align-items: center; gap: 12px;
  }
  .brand .mark {
    width: 38px; height: 38px; flex: 0 0 38px; border-radius: var(--r-sm);
    background: var(--brand); color: #fff;
    display: grid; place-items: center; font-weight: 700; font-size: .9rem;
  }
  .brand h1 { margin: 0; font-size: 1rem; font-weight: 700; color: #fff; line-height: 1.3; }
  .brand p  { margin: 2px 0 0; font-size: .72rem; color: #8FA79E; }

  .nav { padding: 12px 10px; flex: 1; }
  .nav-group {
    font-size: .68rem; letter-spacing: .08em; color: #6E8880;
    padding: 14px 12px 6px; font-weight: 700;
  }
  .nav a {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; margin-bottom: 2px;
    border-radius: var(--r-sm);
    color: #C7D6D0; text-decoration: none;
    font-size: .875rem; font-weight: 600;
    cursor: pointer; transition: background .14s, color .14s;
  }
  .nav a:hover { background: rgba(255,255,255,.06); color: #fff; }
  .nav a.active { background: var(--brand); color: #fff; }
  .nav a .ico { width: 18px; text-align: center; opacity: .9; font-size: .95rem; }

  .sidebar-foot {
    padding: 12px 16px; border-top: 1px solid rgba(255,255,255,.08);
    font-size: .72rem; color: #7B948C;
  }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  .topbar {
    background: var(--surface); border-bottom: 1px solid var(--line);
    padding: 12px 22px; display: flex; align-items: center;
    justify-content: space-between; gap: 14px;
    position: sticky; top: 0; z-index: 20;
  }
  .topbar h2 { margin: 0; font-size: 1.05rem; font-weight: 700; }
  .topbar .who { display: flex; align-items: center; gap: 10px; font-size: .82rem; color: var(--muted); }
  .avatar {
    width: 32px; height: 32px; border-radius: var(--r-pill);
    background: var(--brand-soft); color: var(--brand-deep);
    display: grid; place-items: center; font-weight: 700; font-size: .8rem;
  }

  .content { padding: 22px; flex: 1; }

  /* ───────────── البطاقات ───────────── */
  .panel {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-lg); box-shadow: var(--shadow);
    margin-bottom: 18px; overflow: hidden;
  }
  .panel-header {
    padding: 14px 18px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    flex-wrap: wrap;
  }
  .panel-title {
    margin: 0; font-size: .98rem; font-weight: 700;
    display: flex; align-items: center; gap: 9px;
  }
  .panel-body { padding: 18px; }

  .tint {
    width: 30px; height: 30px; border-radius: var(--r-sm);
    display: grid; place-items: center; font-size: .85rem;
  }
  .tint-brand  { background: var(--brand-soft);  color: var(--brand-deep); }
  .tint-ok     { background: var(--ok-soft);     color: var(--ok); }
  .tint-warn   { background: var(--warn-soft);   color: var(--warn); }
  .tint-danger { background: var(--danger-soft); color: var(--danger); }
  .tint-info   { background: var(--info-soft);   color: var(--info); }

  /* ───────────── الإحصاءات ───────────── */
  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 14px; margin-bottom: 18px;
  }
  .stat {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-lg); padding: 16px 18px; box-shadow: var(--shadow);
  }
  .stat .n {
    font-size: 1.7rem; font-weight: 700; line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .stat .t { font-size: .8rem; color: var(--muted); margin-top: 2px; }

  /* ───────────── التنبيهات ───────────── */
  .alerts { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .alert-card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow);
    border-top: 3px solid var(--line);
  }
  .alert-card.sev-expired  { border-top-color: var(--danger); }
  .alert-card.sev-soon     { border-top-color: var(--warn); }
  .alert-card .ah {
    padding: 12px 16px; display: flex; align-items: center;
    justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--line-soft);
  }
  .alert-card .ah strong { font-size: .88rem; }
  .alert-count {
    min-width: 28px; padding: 1px 9px; border-radius: var(--r-pill);
    font-size: .78rem; font-weight: 700; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .sev-expired .alert-count { background: var(--danger-soft); color: var(--danger); }
  .sev-soon    .alert-count { background: var(--warn-soft);   color: var(--warn); }
  .alert-card ul { list-style: none; margin: 0; padding: 6px 0; }
  .alert-card li {
    padding: 7px 16px; font-size: .83rem;
    display: flex; justify-content: space-between; gap: 10px;
  }
  .alert-card li span.d { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .alert-more { display: block; padding: 9px 16px; font-size: .8rem; color: var(--brand); font-weight: 600; cursor: pointer; border-top: 1px solid var(--line-soft); }

  /* ───────────── الجداول ───────────── */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .86rem; }
  thead th {
    background: var(--sunken); text-align: start; padding: 10px 14px;
    font-weight: 700; font-size: .76rem; color: var(--ink-2);
    letter-spacing: .02em; border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  tbody td { padding: 10px 14px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--sunken); }
  .num { font-variant-numeric: tabular-nums; }
  .empty { padding: 40px 18px; text-align: center; color: var(--muted); font-weight: 600; }

  .badge {
    display: inline-block; padding: 2px 10px; border-radius: var(--r-pill);
    font-size: .74rem; font-weight: 700; white-space: nowrap;
  }
  .badge-ok     { background: var(--ok-soft);     color: var(--ok); }
  .badge-warn   { background: var(--warn-soft);   color: var(--warn); }
  .badge-danger { background: var(--danger-soft); color: var(--danger); }
  .badge-muted  { background: var(--sunken);      color: var(--muted); }
  .badge-info   { background: var(--info-soft);   color: var(--info); }

  /* ───────────── النماذج ───────────── */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .field.wide { grid-column: 1 / -1; }
  label { font-size: .8rem; font-weight: 700; color: var(--ink-2); }
  label .req { color: var(--danger); }
  input[type="text"], input[type="date"], input[type="email"], input[type="search"],
  input[type="tel"], select, textarea {
    width: 100%; padding: 9px 12px; font: inherit; font-size: .88rem;
    color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--r-sm);
  }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--brand);
    box-shadow: 0 0 0 3px var(--brand-soft);
  }
  textarea { resize: vertical; min-height: 64px; }
  .hint { font-size: .74rem; color: var(--muted); }
  .check { display: flex; align-items: center; gap: 8px; }
  .check input { width: 17px; height: 17px; accent-color: var(--brand); }
  .check label { font-weight: 600; }

  fieldset {
    border: 1px solid var(--line); border-radius: var(--r-md);
    padding: 16px 18px; margin: 0 0 18px;
  }
  legend {
    padding: 0 8px; font-size: .84rem; font-weight: 700; color: var(--brand-deep);
  }

  /* ───────────── الأزرار ───────────── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    padding: 9px 16px; font: inherit; font-size: .86rem; font-weight: 700;
    border-radius: var(--r-sm); border: 1px solid transparent;
    cursor: pointer; text-decoration: none; transition: filter .14s, background .14s;
    white-space: nowrap;
  }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--brand-deep); }
  .btn-ghost { background: var(--surface); color: var(--ink-2); border-color: var(--line); }
  .btn-ghost:hover:not(:disabled) { background: var(--sunken); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover:not(:disabled) { filter: brightness(.92); }
  .btn-sm { padding: 5px 11px; font-size: .78rem; }
  .actions { display: flex; gap: 9px; flex-wrap: wrap; }

  .icon-btn {
    width: 30px; height: 30px; border-radius: var(--r-pill);
    border: 1px solid var(--line); background: var(--surface);
    display: grid; place-items: center; cursor: pointer; font-size: .78rem;
    color: var(--ink-2);
  }
  .icon-btn:hover { background: var(--sunken); }
  .icon-btn.danger { color: var(--danger); border-color: var(--danger-soft); }
  .icon-btn.danger:hover { background: var(--danger-soft); }

  /* ───────────── أدوات التصفية ───────────── */
  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .filters .field { min-width: 170px; flex: 1 1 170px; }

  /* ───────────── الرسائل ───────────── */
  #toasts {
    position: fixed; top: 16px; inset-inline-start: 16px;
    z-index: 999; display: flex; flex-direction: column; gap: 8px;
    max-width: min(420px, calc(100vw - 32px));
  }
  .toast {
    padding: 11px 15px; border-radius: var(--r-md);
    box-shadow: var(--shadow-lg); font-size: .86rem; font-weight: 600;
    border-inline-start: 4px solid; background: var(--surface);
    white-space: pre-line;
  }
  .toast-ok    { border-color: var(--ok);     color: var(--ok); }
  .toast-error { border-color: var(--danger); color: var(--danger); }
  .toast-info  { border-color: var(--info);   color: var(--info); }

  /* ───────────── النافذة ───────────── */
  .modal-back {
    position: fixed; inset: 0; background: rgba(12,26,22,.55);
    display: grid; place-items: center; z-index: 500; padding: 16px;
  }
  .modal {
    background: var(--surface); border-radius: var(--r-lg);
    box-shadow: var(--shadow-lg); width: min(520px, 100%);
    max-height: 90vh; overflow: auto;
  }
  .modal-head { padding: 16px 20px; border-bottom: 1px solid var(--line); font-weight: 700; }
  .modal-body { padding: 18px 20px; }
  .modal-foot { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; gap: 9px; justify-content: flex-start; }

  /* ───────────── التحميل ───────────── */
  .loading { padding: 50px 18px; text-align: center; color: var(--muted); font-weight: 600; }
  .spinner {
    width: 26px; height: 26px; margin: 0 auto 12px;
    border: 3px solid var(--line); border-top-color: var(--brand);
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }

  /* ───────────── قوائم الإعدادات ───────────── */
  .ref-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; }
  .ref-list { list-style: none; margin: 0; padding: 0; max-height: 320px; overflow-y: auto; }
  .ref-item {
    padding: 9px 14px; border-bottom: 1px solid var(--line-soft);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .ref-item[hidden] { display: none !important; }
  .ref-item:last-child { border-bottom: none; }
  .ref-item:hover { background: var(--sunken); }
  .ref-item .nm { font-size: .85rem; font-weight: 600; }
  .ref-item .ops { display: flex; gap: 5px; opacity: 0; transition: opacity .14s; }
  .ref-item:hover .ops, .ref-item:focus-within .ops { opacity: 1; }
  @media (hover: none) { .ref-item .ops { opacity: 1; } }
  .ref-search { padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .ref-count { font-size: .74rem; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ───────────── الجوال ───────────── */
  .menu-btn { display: none; }
  @media (max-width: 900px) {
    .app { flex-direction: column; }
    .sidebar {
      position: fixed; inset-inline-start: 0; top: 0; z-index: 400;
      transform: translateX(100%); transition: transform .2s;
      box-shadow: var(--shadow-lg);
    }
    body[dir] .sidebar { transform: translateX(100%); }
    .sidebar.open { transform: translateX(0); }
    .menu-btn { display: grid; }
    .content { padding: 14px; }
    .topbar { padding: 10px 14px; }
    .stats { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
  }
</style>
